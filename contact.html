<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Von Store | Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Von Store</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="features.html">Features</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Order</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="py-5">
  <div class="container">
    <div class="row g-5">
      <div class="col-12 col-lg-5">
        <h1 class="display-6 fw-bold">Get your iPhone 16 locally</h1>
        <p class="lead">Send your order / inquiry form here.</p>
        <div class="alert alert-primary">Limited-time offer: <strong>$699</strong></div>
        <img src="https://cdsassets.apple.com/live/7WUAS350/images/tech-specs/iphone-16.png" class="img-fluid rounded shadow" alt="Placeholder product">
      </div>

      <div class="col-12 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h4 mb-4">Order / Inquiry Form</h2>
            <form>

              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label" for="fname">First Name</label>
                  <input id="fname" class="form-control" type="text">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="lname">Last Name</label>
                  <input id="lname" class="form-control" type="text">
                </div>

                <div class="col-12">
                  <label class="form-label" for="email">Email</label>
                  <input id="email" class="form-control" type="email">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="color">Color option</label>
                  <select id="color" class="form-select">
                    <option>Ultramarine</option>
                    <option>Teal</option>
                    <option>Pink</option>
                    <option>White</option>
                    <option>Blackk</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="quantity">Quantity</label>
                  <input id="quantity" class="form-control" type="number" value="1" min="1">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="color">Storage</label>
                  <select id="color" class="form-select">
                    <option>128GB</option>
                    <option>256GB</option>
                    <option>512GB</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label" for="message">Message</label>
                  <textarea id="message" class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12">
                  <button type="button" class="btn btn-primary btn-lg w-100">Submit Inquiry</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="bg-dark text-white py-4">
  <div class="container"><div class="row"><div class="col-12 text-center">2026 Von Store - iPhone 16 - For WebProg</div></div></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
